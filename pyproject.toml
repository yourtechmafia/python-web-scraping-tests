[project]
name = "python-web-scraping-tests"
version = "0.1.0"
description = "Code, test harnesses and raw results for ScrapingBee's Python web scraping tutorial"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "anthropic>=2.3.0",
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.17.0",
    "html5lib>=1.1",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pandas>=3.1.0",
    "parsel>=1.12.1",
    "playwright>=1.64.1",
    "requests>=2.34.2",
    "scrapingbee>=2.2.0",
    "scrapy>=2.19.0",
    "selectolax>=1.0.2",
    "selenium>=4.52.0",
]



[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "psutil>=7.2.2",
    "pytest>=9.2.0",
]
